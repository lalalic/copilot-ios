<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #mermaid-container {
    width: 100%;
    overflow-x: auto;
  }
  #mermaid-container svg {
    max-width: 100%;
    height: auto;
  }
  .error {
    color: #ff3b30;
    font-size: 14px;
    padding: 12px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: transparent; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<div id="mermaid-container">
  <pre class="mermaid" id="diagram"></pre>
</div>
<script>
  // Initialize mermaid with auto-detect theme
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({
    startOnLoad: false,
    theme: prefersDark ? 'dark' : 'default',
    securityLevel: 'loose',
    flowchart: { useMaxWidth: true },
    sequence: { useMaxWidth: true },
  });

  // Render diagram from source passed via messageHandler
  async function renderDiagram(source) {
    try {
      const container = document.getElementById('mermaid-container');
      const { svg } = await mermaid.render('rendered-diagram', source);
      container.innerHTML = svg;
      // Report height to native
      const height = container.scrollHeight;
      window.webkit?.messageHandlers?.heightChanged?.postMessage(height);
    } catch (error) {
      document.getElementById('mermaid-container').innerHTML =
        '<div class="error">Diagram error: ' + error.message + '</div>';
      window.webkit?.messageHandlers?.heightChanged?.postMessage(60);
    }
  }

  // Listen for messages from native side
  window.webkit?.messageHandlers?.ready?.postMessage(true);
</script>
</body>
</html>
